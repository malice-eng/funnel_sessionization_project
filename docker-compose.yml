services:
  postgres:
    image: postgres:16
    container_name: funnel_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: funnel_user
      POSTGRES_PASSWORD: funnel_pass
      POSTGRES_DB: funnel_analytics
    ports:
      - "5432:5432"
    volumes:
      - funnel_pg_data:/var/lib/postgresql/data

volumes:
  funnel_pg_data:
