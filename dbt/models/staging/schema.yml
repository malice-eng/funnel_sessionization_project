version: 2

seeds:
  - name: raw_events
    description: Raw synthetic clickstream events generated by scripts/generate_data.py
    columns:
      - name: event_id
        tests:
          - unique
          - not_null
      - name: user_id
        tests:
          - not_null

models:
  - name: stg_events
    description: >
      Cleaned, typed, deduplicated event stream. One row per event
      (page view / funnel step) per user.
    columns:
      - name: event_id
        description: Surrogate key for the event.
        tests:
          - unique
          - not_null
      - name: user_id
        description: Anonymized user identifier.
        tests:
          - not_null
      - name: event_name
        description: The funnel/browse event, e.g. view_home, view_product, add_to_cart, checkout, purchase.
        tests:
          - not_null
          - accepted_values:
              values: ['view_home', 'view_product', 'add_to_cart', 'checkout', 'purchase']
      - name: event_timestamp
        description: UTC timestamp the event occurred.
        tests:
          - not_null
